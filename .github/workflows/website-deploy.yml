name: prod · deploy website

# Final deploy of runtypes.pages.dev. RunTypes moved into the mion project and its
# docs live at https://mion.io/runtypes, so this no longer builds the docs site: it
# uploads redirect-site/ (a `_redirects` file that 301s every path to mion.io plus a
# fallback index.html) to the `runtypes` Cloudflare Pages project.
#
# Dispatch it from `main`. `--branch=prod` (the Pages production branch) makes it a
# production deploy whatever the git ref; without it wrangler reads the branch from
# git and only publishes a preview.
on:
  workflow_dispatch:
    inputs:
      # Unused; kept so scripts/release/stage-approve.mjs's `-f version=` dispatch still works.
      version:
        description: 'Unused (the redirect site has no version)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: website-deploy-prod
  cancel-in-progress: false

jobs:
  deploy-website:
    name: deploy the redirect site to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      # Cloudflare Pages project name, from the repo secret (defaults to runtypes).
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT || 'runtypes' }}
    steps:
      - name: Refuse to deploy from a ref that is not main or prod
        if: github.ref_name != 'main' && github.ref_name != 'prod'
        run: |
          echo "::error::website-deploy targets the LIVE site and runs from 'main' or 'prod' only; got '${{ github.ref_name }}'."
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          package-manager-cache: false
      # npx, not cloudflare/wrangler-action: the action installs wrangler into the repo
      # root, and npm cannot read this pnpm workspace there. npx installs it into its own
      # cache. `--branch=prod` makes this a production deploy whatever the git ref.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy redirect-site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=prod
